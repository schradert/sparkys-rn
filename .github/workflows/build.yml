name: Build app artifacts

# Builds the Android and iOS apps and uploads them as GitHub artifacts.
# Self-contained: uses `expo prebuild` + the native toolchains, so it needs no
# EAS token. Android ships a (debug-signed) release APK; iOS ships an unsigned
# simulator build. Signed/store builds need credentials — see README "CI".
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild (android)
        run: bunx expo prebuild --platform android --no-install

      - name: Install matching Android NDK
        run: |
          NDK_VERSION=$(grep -oE 'ndkVersion = "[^"]+"' android/build.gradle | head -1 | cut -d'"' -f2)
          echo "Project NDK: ${NDK_VERSION:-<none declared>}"
          if [ -n "$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          fi

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: android

      - name: Locate APK
        id: apk
        run: echo "path=$(find android/app/build/outputs/apk -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild (ios)
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          # Google Sign-In pulls in Swift pods (AppCheckCore -> GoogleUtilities,
          # RecaptchaInterop) that lack module maps; enable modular headers so
          # they integrate as static libraries.
          if ! grep -q 'use_modular_headers!' Podfile; then
            printf 'use_modular_headers!\n%s' "$(cat Podfile)" > Podfile.tmp
            mv Podfile.tmp Podfile
          fi
          pod install

      - name: Build (simulator, unsigned)
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # Expo names the workspace, Xcode project, and app scheme identically,
          # so derive the app scheme from the workspace (not `schemes[0]`, which
          # is an alphabetical dependency scheme like AppAuth).
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: zip -ry "$GITHUB_WORKSPACE/ios-simulator-app.zip" ./*.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-simulator-app.zip
          if-no-files-found: error
          retention-days: 30
