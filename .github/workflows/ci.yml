name: CI

# Runs the correctness gates (the same ones as the local pre-push git-hooks)
# on every PR and on push to trunk, so nothing merges past type errors, lint
# failures, formatting drift, or failing tests — even if a contributor never
# installed the hooks or pushes with `--no-verify`. Make the `check` job a
# required status check on `trunk` to enforce it.
on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Format · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # expo-router typed routes are generated by Metro and not committed
      # (.expo/, expo-env.d.ts are git-ignored). Spin Metro up briefly so `tsc`
      # checks real route types. Best-effort: tsc passes without them too, so a
      # flaky start never blocks the gate.
      - name: Generate typed routes
        run: APP_VARIANT=development timeout 90 bunx --bun expo start --offline >/dev/null 2>&1 || true

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (ESLint)
        run: bun run lint

      - name: Format + lint (Biome)
        run: bun run check

      - name: Test (Jest)
        run: bun run test

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Surfaces dependency CVEs without blocking merges: the known advisories are
    # transitive (uuid via Expo's xcode dep, js-yaml via eslint/jest) and not
    # directly fixable, so a red here is informational, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun audit
        run: bun audit

  lint-langs:
    name: Shell · YAML · TOML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: actionlint (workflows)
        run: nix run nixpkgs#actionlint
      - name: shellcheck + shfmt (shell)
        run: |
          nix run nixpkgs#shellcheck -- scripts/upgrade-expo.sh
          nix run nixpkgs#shfmt -- -d -s scripts/upgrade-expo.sh
      - name: taplo (TOML)
        run: nix run nixpkgs#taplo -- fmt --check
      - name: yamllint (YAML)
        run: nix run nixpkgs#yamllint -- -c .yamllint.yaml .github/workflows devenv.yaml
